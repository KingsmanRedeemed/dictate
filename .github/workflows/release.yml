name: Release

on:
  workflow_dispatch:
    inputs:
      release-date:
        description: "Release date in YYYY-MM-DD"
        required: true
      sequence:
        description: "Release sequence for this date"
        required: true
        default: "1"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve CalVer
        id: version
        run: |
          VERSION="$(python scripts/calver.py --date '${{ inputs.release-date }}' --sequence '${{ inputs.sequence }}')"
          PEP440="$(python scripts/calver.py --date '${{ inputs.release-date }}' --sequence '${{ inputs.sequence }}' --format pep440)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "pep440=$PEP440" >> "$GITHUB_OUTPUT"

      - name: Validate package version
        run: |
          grep -q 'version = "${{ steps.version.outputs.pep440 }}"' pyproject.toml

      - name: Create tag
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "Dictate ${{ steps.version.outputs.version }}" \
            --notes "CalVer release ${{ steps.version.outputs.version }}."
