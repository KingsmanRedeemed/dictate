[project]
name = "dictate"
version = "0.1.0"
description = "Local voice-to-text for the terminal. Record, transcribe, type."
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "faster-whisper>=1.1.0",
    "numpy>=1.26.0",
    "pynput>=1.7.0",
    "sounddevice>=0.5.0",
]

[project.optional-dependencies]
gpu = ["torch>=2.4.0"]
nemo = ["nemo_toolkit[asr]>=2.4.0"]

[project.scripts]
dictate = "dictate.__main__:main_with_logging"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dictate"]

[tool.ruff]
target-version = "py311"
line-length = 100
